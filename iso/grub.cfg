# AxsOS GRUB menüsü
insmod all_video
serial --unit=0 --speed=115200
terminal_input  console serial
terminal_output console serial
set timeout=4
set default=0

menuentry "AxsOS (masaustu)" {
    echo "AxsOS yukleniyor..."
    set gfxpayload=1280x800x32,1024x768x32,auto
    linux /boot/bzImage quiet console=tty0 console=ttyS0,115200 video=1280x800
    initrd /boot/initramfs.cpio.gz
}

menuentry "AxsOS (metin kipi)" {
    set gfxpayload=text
    linux /boot/bzImage quiet console=tty0 console=ttyS0,115200 axs.gui=0
    initrd /boot/initramfs.cpio.gz
}

menuentry "AxsOS (ayrintili acilis)" {
    set gfxpayload=text
    linux /boot/bzImage console=tty0 console=ttyS0,115200 axs.gui=0
    initrd /boot/initramfs.cpio.gz
}

menuentry "AxsOS (kurtarma: BusyBox sh)" {
    set gfxpayload=text
    linux /boot/bzImage console=tty0 console=ttyS0,115200 rdinit=/bin/sh
    initrd /boot/initramfs.cpio.gz
}
