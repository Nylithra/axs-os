# AxsOS GRUB menüsü
# Menü gizlidir: açılışta 2 sn içinde Esc (ya da Shift) basılırsa görünür.
insmod all_video
insmod gfxterm
insmod png
serial --unit=0 --speed=115200
set gfxmode=1280x800,1024x768,auto
terminal_input  console serial
terminal_output gfxterm serial
if background_image /boot/grub/arka.png; then
    set color_normal=light-gray/black
    set color_highlight=white/magenta
    set menu_color_normal=light-gray/black
    set menu_color_highlight=white/magenta
fi
set timeout_style=hidden
set timeout=2
set default=0

# Sessiz açılış: çekirdek iletileri gizli, ekranın ortasında AxsOS logosu, imleç yok
set sessiz="quiet loglevel=3 initramfs_async=0 fbcon=logo-pos:center vt.global_cursor_default=0"

menuentry "AxsOS" {
    set gfxpayload=1280x800x32,1024x768x32,auto
    linux /boot/bzImage $sessiz console=tty0 console=ttyS0,115200 video=1280x800
    initrd /boot/initramfs.cpio.gz
}

menuentry "AxsOS (canli kip: kalici depolama kullanma)" {
    set gfxpayload=1280x800x32,1024x768x32,auto
    linux /boot/bzImage $sessiz console=tty0 console=ttyS0,115200 video=1280x800 axs.kalici=0
    initrd /boot/initramfs.cpio.gz
}

menuentry "AxsOS (metin kipi)" {
    set gfxpayload=text
    linux /boot/bzImage quiet console=tty0 console=ttyS0,115200 axs.gui=0
    initrd /boot/initramfs.cpio.gz
}

menuentry "AxsOS (ayrintili acilis)" {
    set gfxpayload=text
    linux /boot/bzImage console=tty0 console=ttyS0,115200 axs.gui=0
    initrd /boot/initramfs.cpio.gz
}

menuentry "AxsOS (kurtarma: BusyBox sh)" {
    set gfxpayload=text
    linux /boot/bzImage console=tty0 console=ttyS0,115200 rdinit=/bin/sh axs.kalici=0
    initrd /boot/initramfs.cpio.gz
}
